# Bayesian search over the whole chain, judged by the reward in one condition.
# One file per dataset and condition; they are identical apart from the project
# they write to, the dataset they start from, and the condition they optimize.
#
#   uv run wandb sweep -e bryanboateng-team -p 2026-08-01-sub025-slippery_undisturbed sweeps/2026-08-01-sub025-slippery_undisturbed.yaml
#   CUDA_VISIBLE_DEVICES=0 uv run wandb agent <sweep-id>

program: scripts/sweep/run_pipeline.py
method: bayes

metric:
  name: slippery_undisturbed/reward_mean
  goal: maximize

# run_pipeline is a module, not a script: it imports from the repository root,
# which is only on the path when python is started with -m.
command:
  - ${env}
  - ${interpreter}
  - -m
  - scripts.sweep.run_pipeline
  - --wandb.project=2026-08-01-sub025-slippery_undisturbed
  - --expert-dataset-artifact=bryanboateng-team/datasets/subsampled-dataset-magic-wind-2:v0
  - --floor-condition=SLIPPERY
  - --disturbance-level=None
  - ${args}

parameters:
  # Shape the dynamics model. "none" leaves it unconstrained.
  lipschitz_constant_upper_bound:
    values: ["none", "1", "2", "5", "10", "20"]
  window_length:
    distribution: int_uniform
    min: 1
    max: 8

  # Shape the backward rollout.
  action_noise_fraction:
    distribution: uniform
    min: 0.0
    max: 0.4
  # A multiple of the median expert step, so it spans orders of magnitude.
  error_limit_fraction:
    distribution: log_uniform_values
    min: 0.125
    max: 8.0
