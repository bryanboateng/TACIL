[project]
name = "imitation-learning-and-data-control-augmentation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "diffusers>=0.37.1",
    "gym-pusht>=0.1.6",
    "gymnasium>=1.2.3",
    "h5py>=3.16.0",
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    "mani-skill>=3.0.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.3",
    "opencv-python-headless>=4.13.0.92,<5",
    "pygame>=2.6.1",
    "pymunk==6.6.0",
    "rich>=15.0.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "scipy-stubs~=1.17.1",
    "torch==2.10.0",
    "tqdm>=4.67.3",
    "tyro>=1.0.13",
    "wandb>=0.27.0",
    "zarr>=3.1.5",
]

[dependency-groups]
dev = [
    "ruff>=0.15.15",
    "ty>=0.0.40",
]

[tool.uv]
# gym_pusht pulls in GUI opencv-python (needs libGL, absent on headless servers).
# Force it out so only opencv-python-headless provides cv2. The marker is never
# satisfied, so opencv-python is dropped from resolution entirely.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

# The default torch wheel is built against CUDA 12.8, which dropped the Pascal
# architecture. The cluster's idle GPUs are P100 cards, so that wheel refuses to
# launch a kernel on them. The CUDA 12.6 build still carries sm_50 to sm_90,
# which covers both the P100 and the A100. The version is pinned so that a
# later resolve keeps the torch this thesis was run with, and changes only the
# CUDA build.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false
