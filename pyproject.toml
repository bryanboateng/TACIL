[project]
name = "imitation-learning-and-data-control-augmentation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "diffusers>=0.37.1",
    "gym-pusht>=0.1.6",
    "gymnasium>=1.2.3",
    "h5py>=3.16.0",
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    "mani-skill>=3.0.1",
    "matplotlib>=3.10.9",
    "mujoco>=3.13.0",
    "numpy>=2.4.3",
    "opencv-python-headless>=4.13.0.92,<5",
    "pygame>=2.6.1",
    "pymunk==6.6.0",
    "rich>=15.0.0",
    "scikit-learn>=1.8.0",
    "torch==2.10.0",
    "tqdm>=4.67.3",
    "tyro>=1.0.13",
    "wandb>=0.27.0",
    "zarr>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.15.15",
    "ty>=0.0.40",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
environments = ["sys_platform == 'linux'"]
override-dependencies = [
    "opencv-python; sys_platform == 'never'",
    "mplib; sys_platform == 'never'",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false
